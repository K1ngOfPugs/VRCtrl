<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="VRCtrl">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>VRCtrl</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    object-fit: contain; background: #000; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #777; font: 16px -apple-system, system-ui, sans-serif; text-align: center; padding: 16px;
    pointer-events: none; }
  #status.hidden { display: none; }
  #status.tap { pointer-events: auto; color: #ddd; font-size: 22px; }
</style>
</head>
<body>
<video id="v" muted playsinline loop preload="auto" disablepictureinpicture></video>
<div id="status">Connecting…</div>
<script type="module" src="app.js"></script>
</body>
</html>
