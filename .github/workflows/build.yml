name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries for Fyne
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Test
        run: |
          go test -race ./...
          node --test internal/server/web/sync.test.mjs
      - name: Build
        run: |
          go build -trimpath -ldflags "-s -w" -o vrctrl .
          tar czf vrctrl-linux-amd64.tar.gz vrctrl
      - uses: actions/upload-artifact@v4
        with:
          name: vrctrl-linux-amd64
          path: vrctrl-linux-amd64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: |
          gcc --version
          go test ./internal/...
      - name: Build
        shell: bash
        run: |
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o vrctrl.exe .
          7z a vrctrl-windows-amd64.zip vrctrl.exe
      - uses: actions/upload-artifact@v4
        with:
          name: vrctrl-windows-amd64
          path: vrctrl-windows-amd64.zip

  macos:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/...
      - name: Build universal binary
        run: |
          GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o vrctrl-arm64 .
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" -o vrctrl-amd64 .
          lipo -create -output vrctrl vrctrl-arm64 vrctrl-amd64
          lipo -info vrctrl
      - name: Make VRCtrl.app
        run: |
          APP=VRCtrl.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp vrctrl $APP/Contents/MacOS/vrctrl
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s Icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d Icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o $APP/Contents/Resources/icon.icns
          cat > $APP/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>VRCtrl</string>
            <key>CFBundleDisplayName</key><string>VRCtrl</string>
            <key>CFBundleIdentifier</key><string>io.vrctrl.app</string>
            <key>CFBundleExecutable</key><string>vrctrl</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>VRCtrl serves videos to the headset phones on your local network.</string>
          </dict>
          </plist>
          PLIST
          plutil -lint $APP/Contents/Info.plist
          codesign --force --deep --sign - $APP
          ditto -c -k --keepParent $APP VRCtrl-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VRCtrl-macos-universal
          path: VRCtrl-macos-universal.zip

  release:
    # Version tags (v1.2.3) get their own release. Every push to main also
    # refreshes a rolling "latest" release with the newest builds.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "VRCtrl $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Rolling "latest" release from main
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --target "$GITHUB_SHA" --title "Latest build (main)" \
            --notes "Built automatically from main at ${GITHUB_SHA::7}. Download the file for your computer below."
